@if (foiAbertoAlgumaVez()) {
  <div
    class="fixed inset-0 z-50 flex items-center justify-center
           transition-opacity duration-200 ease-out"
    [class.opacity-100]="aberto()"
    [class.opacity-0]="!aberto()"
    [class.pointer-events-auto]="aberto()"
    [class.pointer-events-none]="!aberto()"
    [attr.aria-hidden]="!aberto()"
  >

    <div
      class="absolute inset-0 bg-black/70 backdrop-blur-[2px]"
      (click)="cancelar.emit()"
    ></div>


    <div
      class="relative
             w-full max-w-sm mx-4
             rounded-2xl
             border border-[#3a3a3a]
             bg-[#181818]
             p-6
             shadow-[0_24px_70px_rgba(0,0,0,0.55)]
             transition-transform duration-200 ease-out"
      [class.scale-100]="aberto()"
      [class.scale-95]="!aberto()"
    >
      <div
        class="flex items-center justify-center
               w-11 h-11
               rounded-full
               border border-red-500/25
               bg-red-500/10
               mb-4"
      >
        <span class="text-red-400 text-xl font-bold">
          !
        </span>
      </div>

      <h2 class="text-xl font-bold text-white mb-2">
        {{ titulo() }}
      </h2>

      <p class="text-sm leading-6 text-[#a7a7a7] mb-6">
        {{ mensagem() }}
      </p>

      <div class="flex flex-col-reverse sm:flex-row justify-end gap-3">

        <button
          type="button"
          class="inline-flex items-center justify-center
                 h-11 px-5
                 rounded-lg
                 border border-[#4a4a4a]
                 bg-transparent
                 text-sm font-medium
                 text-[#c5c5c5]
                 transition
                 hover:border-[#d9b83f]
                 hover:text-[#d9b83f]
                 focus:outline-none
                 focus:ring-0"
          (click)="cancelar.emit()"
        >
          Cancelar
        </button>

        <button
          type="button"
          class="inline-flex items-center justify-center
                 h-11 px-5
                 rounded-lg
                 border border-red-500/40
                 bg-red-500/10
                 text-sm font-semibold
                 text-red-400
                 transition
                 hover:bg-red-500/20
                 hover:border-red-500/60
                 focus:outline-none
                 focus:ring-0"
          (click)="confirmar.emit()"
        >
          {{ textoConfirmar() }}
        </button>

      </div>
    </div>
  </div>
}

<div class="space-y-6">

  <div>
    <p class="text-[#d9b83f] text-sm font-medium uppercase tracking-[0.18em] mb-2">
      Gestão de Passageiros
    </p>

    <h1 class="text-3xl font-bold text-white">
      {{ modoEdicao ? 'Editar passageiro' : 'Novo passageiro' }}
    </h1>

    <p class="text-sm text-[#8f8f8f] mt-2">
      {{
        modoEdicao
          ? 'Atualize as informações do passageiro selecionado.'
          : 'Cadastre um novo passageiro para a operação da AJT Viagens.'
      }}
    </p>
  </div>

  <form
    [formGroup]="form"
    (ngSubmit)="salvar()"
    class="max-w-3xl
           bg-[#181818]
           border border-[#333333]
           rounded-2xl
           shadow-[0_18px_45px_rgba(0,0,0,0.28)]
           p-7 md:p-8
           space-y-6"
  >

    <div>
      <label
        for="nome"
        class="block text-sm font-medium text-[#d5d5d5] mb-2"
      >
        Nome completo
      </label>

      <input
        id="nome"
        type="text"
        formControlName="nome"
        placeholder="Digite o nome completo"
        class="w-full h-12
               rounded-lg
               border border-[#444444]
               bg-[#242424]
               px-4
               text-sm text-white
               placeholder:text-[#6f6f6f]
               outline-none
               transition
               focus:border-[#d9b83f]
               focus:ring-2
               focus:ring-[#d9b83f]/10"
      />
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">

      <div>
        <label
          for="tipoDocumento"
          class="block text-sm font-medium text-[#d5d5d5] mb-2"
        >
          Tipo de documento
        </label>

        <select
          id="tipoDocumento"
          formControlName="tipoDocumento"
          class="w-full h-12
                 rounded-lg
                 border border-[#444444]
                 bg-[#242424]
                 px-4
                 text-sm text-white
                 outline-none
                 transition
                 focus:border-[#d9b83f]
                 focus:ring-2
                 focus:ring-[#d9b83f]/10"
        >
          @for (tipo of tiposDocumento; track tipo) {
            <option
              [value]="tipo"
              class="bg-[#242424] text-white"
            >
              {{ tipo }}
            </option>
          }
        </select>
      </div>

      <div>
        <label
          for="numeroDocumento"
          class="block text-sm font-medium text-[#d5d5d5] mb-2"
        >
          Número do documento
        </label>

        <input
          id="numeroDocumento"
          type="text"
          formControlName="numeroDocumento"
          (input)="aplicarMascaraDocumento($any($event.target).value)"
          placeholder="Digite o número"
          class="w-full h-12
                 rounded-lg
                 border border-[#444444]
                 bg-[#242424]
                 px-4
                 text-sm text-white
                 placeholder:text-[#6f6f6f]
                 outline-none
                 transition
                 focus:border-[#d9b83f]
                 focus:ring-2
                 focus:ring-[#d9b83f]/10"
        />
      </div>

    </div>

    <div>
      <label
        for="nacionalidade"
        class="block text-sm font-medium text-[#d5d5d5] mb-2"
      >
        Nacionalidade
      </label>

      <input
        id="nacionalidade"
        type="text"
        formControlName="nacionalidade"
        placeholder="Ex.: Brasileira"
        class="w-full h-12
               rounded-lg
               border border-[#444444]
               bg-[#242424]
               px-4
               text-sm text-white
               placeholder:text-[#6f6f6f]
               outline-none
               transition
               focus:border-[#d9b83f]
               focus:ring-2
               focus:ring-[#d9b83f]/10"
      />
    </div>

    @if (erro()) {
      <div
        class="rounded-lg
               border border-red-500/30
               bg-red-500/10
               px-4 py-3"
      >
        <p class="text-sm text-red-400">
          {{ erro() }}
        </p>
      </div>
    }

    <div
      class="flex flex-col-reverse sm:flex-row
             sm:items-center sm:justify-end
             gap-3
             pt-2"
    >
      <a
        routerLink="/admin/passageiros"
        class="inline-flex items-center justify-center
               h-12 px-6
               rounded-lg
               border border-[#4a4a4a]
               text-sm font-medium
               text-[#c5c5c5]
               no-underline
               transition
               hover:border-[#d9b83f]
               hover:text-[#d9b83f]"
      >
        Cancelar
      </a>

      <button
        type="submit"
        [disabled]="salvando()"
        class="inline-flex items-center justify-center
               h-12 px-7
               rounded-lg
               bg-gradient-to-r
               from-[#edca54]
               to-[#d8ae31]
               text-[#111]
               text-sm font-bold
               shadow-[0_10px_25px_rgba(218,181,54,0.18)]
               transition
               hover:brightness-105
               active:scale-[0.99]
               disabled:opacity-60
               disabled:cursor-not-allowed"
      >
        {{
          salvando()
            ? 'Salvando...'
            : (modoEdicao ? 'Salvar alterações' : 'Cadastrar passageiro')
        }}
      </button>
    </div>

  </form>

</div>

@if (foiAbertoAlgumaVez()) {
  <div
    class="fixed inset-0 z-50 flex items-center justify-center transition-opacity duration-200 ease-out"
    [class.opacity-100]="aberto()"
    [class.opacity-0]="!aberto()"
    [class.pointer-events-auto]="aberto()"
    [class.pointer-events-none]="!aberto()"
    [attr.aria-hidden]="!aberto()"
  >
    <div class="absolute inset-0 bg-black/50" (click)="cancelar.emit()"></div>

    <div
      class="relative bg-white rounded-lg shadow-xl w-full max-w-sm p-6 mx-4 transition-transform duration-200 ease-out"
      [class.scale-100]="aberto()"
      [class.scale-95]="!aberto()"
    >
      <h2 class="text-lg font-bold text-gray-800 mb-2">{{ titulo() }}</h2>
      <p class="text-sm text-gray-600 mb-6">{{ mensagem() }}</p>

      <div class="flex justify-end gap-3">
        <button
          type="button"
          class="px-4 py-2 text-sm font-medium text-gray-600 hover:bg-gray-100 rounded-md transition-colors"
          (click)="cancelar.emit()"
        >
          Cancelar
        </button>
        <button
          type="button"
          class="px-4 py-2 text-sm font-medium text-white bg-red-600 hover:bg-red-700 rounded-md transition-colors"
          (click)="confirmar.emit()"
        >
          {{ textoConfirmar() }}
        </button>
      </div>
    </div>
  </div>
}

<div class="min-h-screen bg-[#101010] text-white">

  <header
    class="h-20 px-6 lg:px-8
           flex items-center justify-between
           border-b border-[#2c2c2c]
           bg-[#121212]"
  >
    <div class="flex items-center gap-3">

      <div class="w-12 h-12 flex items-center justify-center">
        <img
          src="/logo.png"
          alt="Logo AJT Viagens"
          class="w-12 h-12 object-contain"
        />
      </div>

      <div>
        <h1 class="text-lg font-bold tracking-wide text-white">
          AJT Viagens
        </h1>

        <p class="text-xs text-[#8f8f8f]">
          Painel Administrativo
        </p>
      </div>
    </div>

    <div class="flex items-center gap-4">

      <div class="hidden sm:block text-right">
        <p class="text-sm font-medium text-white">
          {{ auth.usuarioAtual()?.nome }}
        </p>

        <p class="text-xs text-[#d9b83f] uppercase tracking-wider">
          {{ auth.usuarioAtual()?.perfil }}
        </p>
      </div>

      <button
        type="button"
        (click)="sair()"
        class="h-10 px-4
               rounded-lg
               border border-[#3d3d3d]
               bg-transparent
               text-sm text-[#cfcfcf]
               transition
               outline-none
               ring-0
               focus:outline-none
               focus:ring-0
               focus-visible:outline-none
               focus-visible:ring-0
               hover:border-[#d9b83f]
               hover:text-[#d9b83f]"
      >
        Sair
      </button>
    </div>
  </header>

  <div class="flex min-h-[calc(100vh-80px)]">

    <aside
      class="w-64 shrink-0
             bg-[#151515]
             border-r border-[#2c2c2c]
             px-4 py-6"
    >
      <p
        class="px-3 mb-3
               text-[11px]
               uppercase
               tracking-[0.18em]
               text-[#6f6f6f]"
      >
        Navegação
      </p>

      <nav>
        <ul class="space-y-2">

          <li>
            <a
              routerLink="/admin/passageiros"
              routerLinkActive="!bg-[#242424] !text-[#e1bf48] !border-[#d9b83f]"
              class="flex items-center gap-3
                     px-4 py-3
                     rounded-xl
                     border border-transparent
                     text-sm font-medium
                     text-[#b8b8b8]
                     no-underline
                     transition
                     outline-none
                     ring-0
                     focus:outline-none
                     focus:ring-0
                     focus-visible:outline-none
                     focus-visible:ring-0
                     hover:bg-[#202020]
                     hover:text-white"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="currentColor"
                class="w-5 h-5 shrink-0"
              >
                <path
                  d="M8 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm8-1a3 3 0 1 0 0-6 3 3 0 0 0 0 6ZM8 13c-4.4 0-8 2.2-8 5v2h16v-2c0-2.8-3.6-5-8-5Zm8-1c-.8 0-1.6.1-2.3.3 2.6 1.2 4.3 3.1 4.3 5.7v2H24v-2c0-3.3-3.6-6-8-6Z"
                />
              </svg>

              <span>Passageiros</span>
            </a>
          </li>

          <li>
            <a
             routerLink="/admin/motoristas"
              routerLinkActive="!bg-[#242424] !text-[#e1bf48] !border-[#d9b83f]"
              class="flex items-center gap-3
                     px-4 py-3
                     rounded-xl
                     border border-transparent
                     text-sm font-medium
                     text-[#b8b8b8]
                     no-underline
                     transition
                     outline-none
                     ring-0
                     focus:outline-none
                     focus:ring-0
                     focus-visible:outline-none
                     focus-visible:ring-0
                     hover:bg-[#202020]
                     hover:text-white"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                class="w-5 h-5 shrink-0"
              >
                <circle cx="12" cy="12" r="8"></circle>
                <circle cx="12" cy="12" r="2"></circle>
                <path d="M12 10V4"></path>
                <path d="M10.5 13.5 6 17"></path>
                <path d="M13.5 13.5 18 17"></path>
              </svg>

              <span>Motoristas</span>
            </a>
          </li>

          <li>
            <a
              routerLink="/admin/veiculos"
              routerLinkActive="!bg-[#242424] !text-[#e1bf48] !border-[#d9b83f]"
              class="flex items-center gap-3
                     px-4 py-3
                     rounded-xl
                     border border-transparent
                     text-sm font-medium
                     text-[#b8b8b8]
                     no-underline
                     transition
                     outline-none
                     ring-0
                     focus:outline-none
                     focus:ring-0
                     focus-visible:outline-none
                     focus-visible:ring-0
                     hover:bg-[#202020]
                     hover:text-white"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="currentColor"
                class="w-5 h-5 shrink-0"
              >
                <path
                  d="M5.2 6.5A2.5 2.5 0 0 1 7.6 5h8.8a2.5 2.5 0 0 1 2.4 1.5L20 10h1a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1h-1v1.5a1.5 1.5 0 0 1-3 0V18H7v1.5a1.5 1.5 0 0 1-3 0V18H3a1 1 0 0 1-1-1v-6a1 1 0 0 1 1-1h1l1.2-3.5ZM7 7l-1 3h12l-1-3H7Zm0 5.5a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3Zm10 0a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3Z"
                />
              </svg>

              <span>Veículos</span>
            </a>
          </li>

          <li>
            <a
              routerLink="/admin/pontos-coleta"
              routerLinkActive="!bg-[#242424] !text-[#e1bf48] !border-[#d9b83f]"
              class="flex items-center gap-3
                     px-4 py-3
                     rounded-xl
                     border border-transparent
                     text-sm font-medium
                     text-[#b8b8b8]
                     no-underline
                     transition
                     outline-none
                     ring-0
                     focus:outline-none
                     focus:ring-0
                     focus-visible:outline-none
                     focus-visible:ring-0
                     hover:bg-[#202020]
                     hover:text-white"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="currentColor"
                class="w-5 h-5 shrink-0"
              >
                <path
                  d="M12 2a7 7 0 0 0-7 7c0 5.3 7 13 7 13s7-7.7 7-13a7 7 0 0 0-7-7Zm0 9.5A2.5 2.5 0 1 1 12 6a2.5 2.5 0 0 1 0 5.5Z"
                />
              </svg>

              <span>Pontos de Coleta</span>
            </a>
          </li>

          <li>
            <a
              routerLink="/admin/transfers"
              routerLinkActive="!bg-[#242424] !text-[#e1bf48] !border-[#d9b83f]"
              class="flex items-center gap-3
                     px-4 py-3
                     rounded-xl
                     border border-transparent
                     text-sm font-medium
                     text-[#b8b8b8]
                     no-underline
                     transition
                     outline-none
                     ring-0
                     focus:outline-none
                     focus:ring-0
                     focus-visible:outline-none
                     focus-visible:ring-0
                     hover:bg-[#202020]
                     hover:text-white"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="currentColor"
                class="w-5 h-5 shrink-0"
              >
                <path
                  d="M7 7h10l-2.5-2.5L16 3l5 5-5 5-1.5-1.5L17 9H7V7Zm10 10H7l2.5 2.5L8 21l-5-5 5-5 1.5 1.5L7 15h10v2Z"
                />
              </svg>

              <span>Transfers</span>
            </a>
          </li>

          <li>
            <a
            routerLink="/admin/ordens-servico"
              routerLinkActive="!bg-[#242424] !text-[#e1bf48] !border-[#d9b83f]"
              class="flex items-center gap-3
                     px-4 py-3
                     rounded-xl
                     border border-transparent
                     text-sm font-medium
                     text-[#b8b8b8]
                     no-underline
                     transition
                     outline-none
                     ring-0
                     focus:outline-none
                     focus:ring-0
                     focus-visible:outline-none
                     focus-visible:ring-0
                     hover:bg-[#202020]
                     hover:text-white"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                class="w-5 h-5 shrink-0"
              >
                <rect x="5" y="3" width="14" height="18" rx="2"></rect>
                <path d="M8 8h8"></path>
                <path d="M8 12h8"></path>
                <path d="M8 16h5"></path>
              </svg>

              <span>Ordens de Serviço</span>
            </a>
          </li>

        </ul>
      </nav>
    </aside>

    <main
      class="flex-1
             min-w-0
             bg-[#111111]
             p-6 lg:p-10"
    >
      <router-outlet></router-outlet>
    </main>

  </div>
</div>

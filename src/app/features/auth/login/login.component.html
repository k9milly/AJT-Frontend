<div class="min-h-screen flex items-center justify-center px-4 bg-[#242424]">
  <div
    class="w-full max-w-[515px] min-h-[715px] bg-[#181818] border border-[#3a3a3a]
           rounded-[22px] shadow-[0_20px_60px_rgba(0,0,0,0.45)]
           px-12 py-14 flex flex-col"
  >

    <div class="flex justify-center mb-7">
      <div
        class="w-14 h-14 flex items-center justify-center
               text-[#e6c04d] text-4xl"
      >
        ◉
      </div>
    </div>


    <h1
      class="text-center text-[#e6c04d] text-[28px] font-bold leading-tight"
    >
      Painel AJT Viagens
    </h1>

    <p
      class="text-center text-[#a9a9a9] text-[19px] mt-3 mb-9"
    >
      Acesso restrito à equipe.
    </p>

    <form
      [formGroup]="form"
      (ngSubmit)="entrar()"
      class="flex flex-col"
    >
   
      <div class="mb-6">
        <label
          for="email"
          class="block text-[#b5b5b5] text-[18px] mb-2"
        >
          Usuário
        </label>

        <input
          id="email"
          type="email"
          formControlName="email"
          class="w-full h-[68px] rounded-[9px] border border-[#505050]
                 bg-[#282828] px-4 text-white text-[17px]
                 outline-none transition
                 focus:border-[#e6c04d]
                 focus:ring-2 focus:ring-[#e6c04d]/10"
        />
      </div>


      <div class="mb-6">
        <label
          for="senha"
          class="block text-[#b5b5b5] text-[18px] mb-2"
        >
          Senha
        </label>

        <input
          id="senha"
          type="password"
          formControlName="senha"
          class="w-full h-[68px] rounded-[9px] border border-[#505050]
                 bg-[#282828] px-4 text-white text-[17px]
                 outline-none transition
                 focus:border-[#e6c04d]
                 focus:ring-2 focus:ring-[#e6c04d]/10"
        />
      </div>

      @if (erro()) {
        <p class="text-sm text-red-400 mb-4">
          {{ erro() }}
        </p>
      }


      <button
        type="submit"
        [disabled]="carregando()"
        class="w-full h-[66px] rounded-[8px]
               bg-gradient-to-r from-[#efcb5a] to-[#dfb638]
               text-[#111] text-[18px] font-bold
               shadow-[0_14px_30px_rgba(229,187,59,0.18)]
               transition
               hover:brightness-105
               active:scale-[0.99]
               disabled:opacity-60
               disabled:cursor-not-allowed"
      >
        {{ carregando() ? 'Entrando...' : 'Entrar' }}
      </button>


      <a
        href="/"
        class="text-center text-[#a9a9a9] text-[18px]
               mt-6 no-underline transition
               hover:text-[#e6c04d]"
      >
        ← Voltar para o Site
      </a>
    </form>
  </div>
</div>

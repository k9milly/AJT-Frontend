<div class="min-h-screen flex items-center justify-center bg-gray-100 px-4">
  <div class="w-full max-w-sm bg-white rounded-xl shadow-md p-8">
    <h1 class="text-2xl font-bold text-gray-800 mb-1">AJT Viagens e Turismo</h1>
    <p class="text-sm text-gray-500 mb-6">Acesse o sistema receptivo</p>

    <form [formGroup]="form" (ngSubmit)="entrar()" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1" for="email">E-mail</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
          placeholder="seu@email.com"
        />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1" for="senha">Senha</label>
        <input
          id="senha"
          type="password"
          formControlName="senha"
          class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
          placeholder="••••••••"
        />
      </div>

      @if (erro()) {
        <p class="text-sm text-red-600">{{ erro() }}</p>
      }

      <button
        type="submit"
        [disabled]="carregando()"
        class="w-full bg-blue-600 hover:bg-blue-700 disabled:opacity-60 text-white font-medium rounded-md py-2 text-sm transition-colors"
      >
        {{ carregando() ? 'Entrando...' : 'Entrar' }}
      </button>

      <p class="text-xs text-gray-400 text-center pt-2">
        Usuários de teste: admin&#64;ajt.com / gerente&#64;ajt.com / motorista&#64;ajt.com — senha 123456
      </p>
    </form>
  </div>
</div>
